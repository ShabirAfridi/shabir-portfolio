<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!--
  Fragment: nav
  Usage in any page:
    <div th:replace="~{fragments/nav :: navigation(activePage=${activePage})}"></div>
-->
<nav th:fragment="navigation(activePage)"
     class="fixed top-0 left-0 w-full z-50 bg-[#0c0e12]/80 backdrop-blur-xl border-b border-outline-variant/10">

  <div class="flex justify-between items-center px-6 md:px-12 py-5 max-w-screen-2xl mx-auto">

    <!-- Logo -->
    <a th:href="@{/}" class="text-lg font-bold text-on-surface font-headline tracking-tight">
      SHABIR<span class="text-primary">.DEV</span>
    </a>

    <!-- Desktop Links -->
    <div class="hidden md:flex gap-10 items-center">
      <a th:href="@{/about}"
         th:classappend="${activePage == 'about'} ? '!text-primary' : ''"
         class="nav-link font-headline uppercase tracking-widest text-xs text-on-surface/60 hover:text-on-surface transition-all duration-300">
        About
      </a>
      <a th:href="@{/about}"
         class="nav-link font-headline uppercase tracking-widest text-xs text-on-surface/60 hover:text-on-surface transition-all duration-300">
        Skills
      </a>
      <a th:href="@{/services}"
         th:classappend="${activePage == 'services'} ? '!text-primary' : ''"
         class="nav-link font-headline uppercase tracking-widest text-xs text-on-surface/60 hover:text-on-surface transition-all duration-300">
        Projects
      </a>
      <a th:href="@{/about}"
         class="nav-link font-headline uppercase tracking-widest text-xs text-on-surface/60 hover:text-on-surface transition-all duration-300">
        Education
      </a>
      <a th:href="@{/contact}"
         th:classappend="${activePage == 'contact'} ? '!text-primary' : ''"
         class="nav-link font-headline uppercase tracking-widest text-xs text-on-surface/60 hover:text-on-surface transition-all duration-300">
        Contact
      </a>
      <a href="mailto:shabirofridi@gmail.com"
         class="bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-headline font-bold px-6 py-2.5 rounded-xl active:scale-95 hover:shadow-[0_0_20px_rgba(0,245,212,0.3)] transition-all duration-300 uppercase tracking-tight text-xs">
        Hire Me
      </a>
    </div>

    <!-- Mobile Hamburger -->
    <button id="hamburger-btn" class="md:hidden text-primary focus:outline-none" aria-label="Toggle menu">
      <span id="icon-open"  class="material-symbols-outlined">menu</span>
      <span id="icon-close" class="material-symbols-outlined hidden">close</span>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="md:hidden bg-[#111318] border-t border-outline-variant/10">
    <div class="flex flex-col px-6 py-6 gap-5">
      <a th:href="@{/about}"    onclick="closeMobileMenu()" class="font-headline uppercase tracking-widest text-sm text-on-surface/70 hover:text-primary transition-colors">About</a>
      <a th:href="@{/about}"    onclick="closeMobileMenu()" class="font-headline uppercase tracking-widest text-sm text-on-surface/70 hover:text-primary transition-colors">Skills</a>
      <a th:href="@{/services}" onclick="closeMobileMenu()" class="font-headline uppercase tracking-widest text-sm text-on-surface/70 hover:text-primary transition-colors">Projects</a>
      <a th:href="@{/about}"    onclick="closeMobileMenu()" class="font-headline uppercase tracking-widest text-sm text-on-surface/70 hover:text-primary transition-colors">Education</a>
      <a th:href="@{/contact}"  onclick="closeMobileMenu()" class="font-headline uppercase tracking-widest text-sm text-on-surface/70 hover:text-primary transition-colors">Contact</a>
      <a href="mailto:shabirofridi@gmail.com"
         class="bg-gradient-to-br from-primary to-primary-container text-on-primary-fixed font-headline font-bold px-6 py-3 rounded-xl text-center uppercase tracking-tight text-sm">
        Hire Me
      </a>
    </div>
  </div>
</nav>

</html>
